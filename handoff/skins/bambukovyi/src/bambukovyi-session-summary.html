<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>@font-face{font-family:"Kurale";src:url("fonts/Kurale-Regular.ttf")}@font-face{font-family:"Golos Text";font-weight:400 900;src:url("fonts/GolosText-VariableFont_wght.ttf")}

*{box-sizing:border-box;margin:0;padding:0}body{width:390px;height:844px;overflow:hidden;position:relative;font-family:"Golos Text",sans-serif;font-weight:600;color:#1b1d18;background:#f2eee2}
.abs{position:absolute;pointer-events:none}.H{font-family:"Kurale",serif;font-weight:400}.num{font-family:"Geologica",sans-serif;font-weight:600}
.card{position:relative;background:#fbf8ef;border-radius:4px;box-shadow:0 0 0 1px #d6cfb9,0 3px 10px rgba(40,40,20,.10)}
.card>.tc{left:14px;top:6px}
.hdr{position:absolute;top:0;left:0;right:0;padding:52px 20px 0;display:flex;align-items:center;justify-content:space-between;z-index:2}
.hdr h1{font-family:"Kurale",serif;font-weight:400;font-size:31px;color:#1b1d18;letter-spacing:0.3px;line-height:1}
.bal{display:flex;align-items:center;gap:6px;padding:3px 14px 3px 3px;font-weight:700;font-size:14px;color:#1b1d18;background:#fbf8ef;border-radius:20px;box-shadow:0 0 0 1.5px #cfc8b3}
.nav{position:absolute;left:14px;right:14px;bottom:14px;height:66px;display:flex;align-items:center;padding:0 8px;isolation:isolate}
.nav .t{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;font-weight:700;color:#4c5245;position:relative;padding:6px 0}
.nav .on{color:#ffffff}.nav .on:before{content:"";position:absolute;inset:2px 8px;z-index:-1;background:#2f5d3a;border-radius:4px}
.btn{display:flex;align-items:center;justify-content:center;height:52px;font-family:"Kurale",serif;font-weight:400;font-size:22px;color:#ffffff;background:#2f5d3a;border-radius:4px;box-shadow:0 0 0 1.5px #22462b}
.bar{height:8px;background:#ebe6d6;border-radius:4px;box-shadow:inset 0 0 0 1px #cfc8b3}.bar i{display:block;height:100%;border-radius:4px;background:#2f5d3a}
.cap{font-size:12.5px;color:#4c5245}
/* читалка: страница чистая — без декора и маскота */
.rd{position:absolute;inset:0;background:#f8f5ec;color:#1b1d18}
.page{position:absolute;top:96px;bottom:150px;left:0;right:0;overflow:hidden;padding:20px 26px 0;font-family:"Roboto Serif",serif;font-size:16px;line-height:1.7}
.page h3{font-family:"Kurale",serif;font-weight:400;font-size:24px;margin-bottom:12px}.page p{text-indent:1.4em;margin-bottom:6px}
.rtop{position:absolute;top:0;left:0;right:0;height:96px;padding:44px 8px 0;display:flex;align-items:center;background:#efeadc;box-shadow:0 1px 0 #d6cfb9}
.rtop .t{flex:1;text-align:center;font-family:"Kurale",serif;font-weight:400;font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;display:flex;align-items:center;justify-content:center;color:#2f5d3a}
.rbot{position:absolute;left:0;right:0;bottom:0;height:150px;background:#efeadc;box-shadow:0 -1px 0 #d6cfb9;padding:16px 22px 0}
.pg{display:flex;justify-content:center;font-size:15px;margin-bottom:10px;font-weight:700}
.sl{position:relative;height:24px}.sl .tr{position:absolute;top:10px;left:0;right:0;height:4px;border-radius:2px;background:#d6cfb9}.sl .fi{position:absolute;top:10px;left:0;height:4px;border-radius:2px;background:#2f5d3a}
.sl .th{position:absolute;top:2px;margin-left:-10px;width:20px;height:20px;border-radius:50%;background:#f8f5ec;border:2px solid #2f5d3a}
.tools{display:flex;justify-content:space-around;margin-top:14px;font-size:13px;font-weight:700}.tools div{display:flex;flex-direction:column;align-items:center;gap:3px}.tools svg{color:#2f5d3a}
.night .rd{background:#0f120f;color:#e2e5d8}.night .rtop,.night .rbot{background:#191d18}.night .rtop{box-shadow:0 1px 0 #2c322a}.night .rbot{box-shadow:0 -1px 0 #2c322a}
.night .rtop .t,.night .pg,.night .tools{color:#e9ecdf}.night .ib,.night .tools svg{color:#e7b964}
.night .sl .tr{background:#2c322a}.night .sl .fi{background:#e7b964}.night .sl .th{background:#0f120f;border-color:#e7b964}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
