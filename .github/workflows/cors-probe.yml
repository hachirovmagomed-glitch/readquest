# Temporary: checks which free-book sources send CORS headers (thread «Приключения»). Removed before merge.
name: cors-probe
on:
  push:
    branches: [claude/project-thread-up771x]
    paths: [.github/workflows/cors-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          O="https://hachirovmagomed-glitch.github.io"
          for u in \
            "https://www.gutenberg.org/ebooks/1342.opds" \
            "https://www.gutenberg.org/ebooks/1342.epub3.images" \
            "https://www.gutenberg.org/ebooks/1342.epub.noimages" \
            "https://www.gutenberg.org/ebooks/1342.txt.utf-8" \
            "https://www.gutenberg.org/files/1342/1342-0.txt" \
            "https://www.gutenberg.org/ebooks/search.opds/?sort_order=downloads&query=l.ru" \
            "https://standardebooks.org/ebooks/jane-austen/pride-and-prejudice/downloads/jane-austen_pride-and-prejudice.epub?source=download" \
            "https://librivox.org/api/feed/audiobooks?limit=1&format=json" ; do
            echo "=== $u"
            curl -sS -m 30 -o /dev/null -D - -H "Origin: $O" "$u" | grep -iE "^(HTTP/|access-control-allow-origin|location|content-type)" || echo "(failed)"
          done
          echo "=== OPTIONS preflight-less check done"
          echo "=== gutenberg opds search (ru, popular)"
          curl -sS -m 30 "https://www.gutenberg.org/ebooks/search.opds/?sort_order=downloads&query=l.ru" | head -c 5000; echo
          echo "=== gutenberg opds book"
          curl -sS -m 30 "https://www.gutenberg.org/ebooks/1342.opds" | head -c 5000; echo
          echo "=== gutenberg opds root"
          curl -sS -m 30 "https://www.gutenberg.org/ebooks.opds/" | head -c 3000; echo
          P="https://ru.wikisource.org/w/api.php?action=parse&format=json&formatversion=2&origin=*&redirects=1&prop=text|displaytitle|categories|links&page="
          for t in "%D0%93%D0%B0%D0%BC%D0%BB%D0%B5%D1%82_(%D0%A8%D0%B5%D0%BA%D1%81%D0%BF%D0%B8%D1%80;_%D0%9A%D1%80%D0%BE%D0%BD%D0%B5%D0%B1%D0%B5%D1%80%D0%B3)" \
                   "%D0%93%D0%B0%D0%BC%D0%BB%D0%B5%D1%82_(%D0%A8%D0%B5%D0%BA%D1%81%D0%BF%D0%B8%D1%80;_%D0%9A%D1%80%D0%BE%D0%BD%D0%B5%D0%B1%D0%B5%D1%80%D0%B3)/%D0%9F%D0%A1%D0%A1_1902_(%D0%92%D0%A2)" \
                   "%D0%93%D0%B0%D0%BC%D0%BB%D0%B5%D1%82_(%D0%A8%D0%B5%D0%BA%D1%81%D0%BF%D0%B8%D1%80;_%D0%9A%D1%80%D0%BE%D0%BD%D0%B5%D0%B1%D0%B5%D1%80%D0%B3)/%D0%9F%D0%A1%D0%A1_1902_(%D0%92%D0%A2)/%D0%94%D0%B5%D0%B9%D1%81%D1%82%D0%B2%D0%B8%D0%B5_I" \
                   "%D0%93%D0%B0%D0%BC%D0%BB%D0%B5%D1%82,_%D0%BF%D1%80%D0%B8%D0%BD%D1%86_%D0%B4%D0%B0%D1%82%D1%81%D0%BA%D0%B8%D0%B9_(%D0%A8%D0%B5%D0%BA%D1%81%D0%BF%D0%B8%D1%80;_%D0%A0%D0%BE%D1%81%D1%81%D0%BE%D0%B2)" ; do
            echo "=== WS $t"
            curl -sS -m 30 "$P$t" > ws.json; python3 -c "
          import json,sys
          d=json.load(open('ws.json'))
          if 'error' in d: print(d['error']); sys.exit()
          p=d['parse']; print('TITLE',p['title']); print('CATS',[c['category'] for c in p.get('categories',[])][:30])
          print('LINKS',[l['title'] for l in p.get('links',[]) if l.get('ns')==0][:60])
          h=p['text']; print('LEN',len(h)); print(h[:3500]); print('...TAIL...'); print(h[-2500:])"
          done
