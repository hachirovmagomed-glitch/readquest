# Temporary (thread up771x, 08.11): fetch more public-domain author portraits and books for the collections from Wikimedia Commons into source/hero/authors. Removed after.
name: ws-probe
on:
  push:
    branches: [claude/project-thread-up771x]
    paths: [.github/workflows/ws-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/project-thread-up771x }
      - run: pip install -q pillow "opencv-python-headless==4.10.0.84" "numpy<2.3" && python3 -c "import cv2;print(cv2.__version__,cv2.__file__,hasattr(cv2,'CascadeClassifier'))"
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          cat > /tmp/p.py <<'PY'
          import json,urllib.request,urllib.parse,time,io,os,sys,re
          from PIL import Image
          UA={'User-Agent':'readquest-portraits/1.0 (github actions; public domain portraits)'}
          def get(u):
              for i in range(4):
                  try: return urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=60).read()
                  except Exception as e: print('retry',u[:90],e); time.sleep(20*(i+1))
              raise RuntimeError('failed '+u)
          def api(host,params):
              return json.loads(get('https://'+host+'/w/api.php?'+urllib.parse.urlencode(dict(params,format='json',formatversion=2))))
          A=[tuple(l.strip().split('|')[:2]) for l in open('probe/authors.txt') if l.strip()]
          OVR=json.loads(os.environ.get('OVR','{}'))
          out='source/hero/authors';os.makedirs(out,exist_ok=True);cred=json.load(open(out+'/credits.json'))
          import subprocess
          def save(msg):
              json.dump(cred,open(out+'/credits.json','w'),ensure_ascii=False,indent=1)
              subprocess.run('git add source/hero/authors && git commit -qm "'+msg+'" && for i in 1 2 3 4 5; do git pull -q --rebase origin claude/project-thread-up771x && git push -q origin HEAD:claude/project-thread-up771x && break; sleep 10; done',shell=True)
          for n,(k,t) in enumerate(A):
            if n and n%40==0: save('Портреты авторов: часть (временный workflow)')
            try:
              if os.path.exists(out+'/'+k+'.webp'): continue
              f=OVR.get(k)
              if not f:
                  d=api('en.wikipedia.org',{'action':'query','titles':t,'prop':'pageimages','piprop':'name','redirects':1})
                  f='File:'+d['query']['pages'][0]['pageimage']
              m=api('commons.wikimedia.org',{'action':'query','titles':f,'prop':'imageinfo','iiprop':'url|extmetadata|size','iiurlwidth':900})
              p=m['query']['pages'][0]
              if 'imageinfo' not in p: print('NOFILE',k,f); continue
              ii=p['imageinfo'][0];em=ii.get('extmetadata',{})
              lic=em.get('LicenseShortName',{}).get('value','');art=em.get('Artist',{}).get('value','')
              art=re.sub('<[^>]+>','',art).strip()[:120]
              print('IMG',k,f,ii['width'],ii['height'],'|',lic,'|',art)
              if not re.match(r'(?i)(public domain|pd|cc0)',lic): print('SKIP not PD',k); continue
              im=Image.open(io.BytesIO(get(ii['thumburl']))).convert('RGB')
              import cv2,numpy as np
              g=cv2.cvtColor(np.array(im),cv2.COLOR_RGB2GRAY);w,h=im.size
              cc=cv2.CascadeClassifier(cv2.data.haarcascades+'haarcascade_frontalface_default.xml')
              fs=sorted(cc.detectMultiScale(g,1.1,5,minSize=(w//12,w//12)),key=lambda r:-r[2]*r[3])
              if not len(fs):
                  cp=cv2.CascadeClassifier(cv2.data.haarcascades+'haarcascade_profileface.xml');fs=sorted(cp.detectMultiScale(g,1.1,4,minSize=(w//12,w//12)),key=lambda r:-r[2]*r[3])
              if len(fs):
                  x,y,fw,fh=[int(v) for v in fs[0]];side=int(max(fw,fh)*2.3);cx=x+fw//2;cy=y+int(fh*0.62)
                  side=min(side,w,h);l=max(0,min(w-side,cx-side//2));t=max(0,min(h-side,cy-side//2));box=(l,t,l+side,t+side);print('FACE',k,box)
              else:
                  s0=min(w,h);l=(w-s0)//2;t=int((h-s0)*0.12) if h>w else 0;box=(l,t,l+s0,t+s0);print('NOFACE',k)
              im=im.crop(box).resize((160,160),Image.LANCZOS)
              im.save(out+'/'+k+'.webp','WEBP',quality=76)
              cred[k]={'file':f,'license':lic,'artist':art,'url':'https://commons.wikimedia.org/wiki/'+urllib.parse.quote(f.replace(' ','_'))}
              time.sleep(6)
            except Exception as e: print('ERR',k,e); time.sleep(10)
          save('Портреты авторов: ещё сотня писателей (Wikimedia Commons, временный workflow)')
          PY
          python3 /tmp/p.py
        env:
          OVR: '{}'
  books:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/project-thread-up771x }
      - run: |
          cat > /tmp/b.py <<'PY'
          import json,urllib.request,urllib.parse,time,re
          UA={'User-Agent':'readquest-probe/1.0 (github actions)'}
          WS='https://ru.wikisource.org/w/api.php?'
          def js(p):
              for i in range(5):
                  try: return json.loads(urllib.request.urlopen(urllib.request.Request(WS+urllib.parse.urlencode(dict(p,format='json',formatversion=2)),headers=UA),timeout=60).read())
                  except Exception as e: print('retry',e); time.sleep(10*(i+1))
              return None
          H=json.load(open('probe/harvest.json'));res={}
          for st,names in H.items():
              items=[]
              for n in names:
                  d=js({'action':'query','list':'search','srnamespace':102,'srlimit':3,'srsearch':n}) or {}
                  hs=[h['title'] for h in d.get('query',{}).get('search',[])]
                  if not hs: print('noauthor',n);continue
                  p=js({'action':'parse','page':hs[0],'prop':'text'}) or {}
                  html=p.get('parse',{}).get('text','');html=re.sub(r'(?s)<(table|div)[^>]*class="[^"]*navbox.*?</\1>','',html)
                  seen=set()
                  for m in re.finditer(r'<a ([^>]*)>',html):
                      a=m.group(1)
                      if 'class="new"' in a: continue
                      tt=re.search(r'title="([^"]*)"',a)
                      if not tt: continue
                      tt=tt.group(1).replace('&quot;','"').replace('&amp;','&').replace('&#39;',"'");root=tt.split('/')[0]
                      if re.match(r'^[^:]+:\S',tt) or '(' not in root or re.search(r'ДО\)|\(ДО|старой орфографии',tt) or root in seen: continue
                      seen.add(root);items.append([n,root])
                  time.sleep(0.7)
              print(st,len(items),flush=True)
              info={}
              titles=list(dict.fromkeys(x[1] for x in items))
              for i in range(0,len(titles),10):
                  B=titles[i:i+10]
                  d=js({'action':'query','titles':'|'.join(B),'redirects':1,'prop':'categories|info|pageprops','cllimit':'max','ppprop':'disambiguation'})
                  if d is None: continue
                  q=d.get('query',{});rd={}
                  for r in q.get('normalized',[])+q.get('redirects',[]): rd[r['from']]=r['to']
                  pg={p['title']:p for p in q.get('pages',[])}
                  for t in B:
                      tt=t
                      for _ in range(3): tt=rd.get(tt,tt)
                      p=pg.get(tt)
                      if not p or p.get('missing'): info[t]={'miss':1};continue
                      info[t]={'to':tt,'len':p.get('length',0),'dis':'disambiguation' in p.get('pageprops',{}),'cats':[c['title'].replace('Категория:','') for c in p.get('categories',[])][:25]}
                  time.sleep(0.4)
              res[st]=[{'a':n,'t':t,**info.get(t,{'miss':1,'err':1})} for n,t in items]
          json.dump(res,open('probe/books-out.json','w'),ensure_ascii=False)
          PY
          python3 /tmp/b.py
          git config user.name "github-actions[bot]"; git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add probe/books-out.json && git commit -qm "probe: книги для подборок" && for i in 1 2 3 4 5; do git pull -q --rebase origin claude/project-thread-up771x && git push -q origin HEAD:claude/project-thread-up771x && break; sleep 15; done
