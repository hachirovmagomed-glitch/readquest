# Temporary: how the fixed licence/list rules classify real Wikisource search results (thread «Приключения»). Removed after.
name: ws-probe
on:
  push:
    branches: [claude/project-thread-up771x]
    paths: [.github/workflows/ws-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          cat > p.py <<'PY'
          import json,re,time,urllib.request,urllib.parse
          A='https://ru.wikisource.org/w/api.php?'
          def g(**q):
              q.update(format='json',formatversion=2,origin='*')
              for i in range(5):
                  try:
                      r=urllib.request.Request(A+urllib.parse.urlencode(q),headers={'User-Agent':'readquest-probe/1.0 (github actions)'})
                      return json.load(urllib.request.urlopen(r,timeout=30))
                  except urllib.error.HTTPError as e:
                      if e.code!=429: raise
                      time.sleep(3*(i+1))
          cat=lambda c:c['title'].replace('Категория:','')
          FREE=re.compile(r'^PD[- ]|^CC[- ]|^GFDL|Общественное достояние|Свободн',re.I)
          BAD=re.compile(r'нарушени|копивио|copyvio|к удалению|удаляем|несвобод|не свобод|авторск',re.I)
          LIST=re.compile(r'^Списки |Служебные списки|Неоднозначн|Многозначн|^Авторы|^Персоналии',re.I)
          tot={}
          for s in ['Гомер','Шекспир','Толстой','Война и мир','Пушкин','Диккенс','Жюль Верн','Андерсен','Дон Кихот','Чехов','Гоголь','Лермонтов']:
              d=g(action='query',list='search',srsearch=s,srnamespace=0,srlimit=40); time.sleep(1)
              roots=[]
              for h in d['query']['search']:
                  r=h['title'].split('/')[0]
                  if r not in roots: roots.append(r)
              c=g(action='query',prop='categories|info|pageprops',ppprop='disambiguation',cllimit='max',titles='|'.join(roots[:20])); time.sleep(1)
              print('\n=== Q',s)
              for p in c['query']['pages']:
                  cats=[cat(x) for x in p.get('categories',[])]
                  lst='disambiguation' in (p.get('pageprops') or {}) or any(LIST.search(x) for x in cats)
                  v='LIST' if lst else 'LIC' if any(FREE.search(x) for x in cats) else 'BAD' if any(BAD.search(x) for x in cats) else 'NOLIC'
                  tot[v]=tot.get(v,0)+1
                  print(' ',v.ljust(5),p['title'],'| len',p.get('length'),'|',[x for x in cats if BAD.search(x) or LIST.search(x)] if v in('BAD','LIST') else cats[:5])
          print('\nTOTAL',tot)
          PY
          python3 p.py
