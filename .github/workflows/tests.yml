# Runs the full test suite (source/test/run-all.sh) on every push and pull request.
# main holds only built pages (no source/), so it is skipped.
name: tests

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scriptv archives an old commit, importskin serves origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fonts for the test PDFs
        run: sudo apt-get install -y -qq fonts-dejavu-core

      - name: Prepare test environment
        run: bash .github/ci/setup.sh

      - name: Run all tests
        working-directory: source/test
        run: ./run-all.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: /tmp/rq-runall/
          retention-days: 14
