# Temporary probe for «Приключения» (thread up771x): Internet Archive free-only search and OCR text sample. Removed after.
name: ws-probe
on:
  push:
    branches: [claude/project-thread-up771x]
    paths: [.github/workflows/ws-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          cat > p.py <<'PY'
          import json,urllib.request,urllib.parse
          UA={'User-Agent':'readquest-probe/1.0 (github actions)','Origin':'https://example.org'}
          def get(u):
              x=urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=60); return x,x.read()
          FREE='(licenseurl:*publicdomain* OR date:[1000-01-01 TO 1929-12-31] OR year:[1000 TO 1929])'
          NOT='NOT collection:(inlibrary OR printdisabled OR lendinglibrary OR internetarchivebooks) NOT access-restricted-item:true'
          Q=[('ru-all','mediatype:texts AND language:(rus OR Russian) AND format:DjVuTXT AND '+FREE+' AND '+NOT),
             ('ru-tolstoy','(толстой OR Толстой) AND mediatype:texts AND language:(rus OR Russian) AND format:DjVuTXT AND '+FREE+' AND '+NOT),
             ('ru-pushkin','пушкин AND mediatype:texts AND language:(rus OR Russian) AND format:DjVuTXT AND '+FREE+' AND '+NOT),
             ('bbl-ru','collection:booksbylanguage_russian AND format:DjVuTXT AND '+FREE+' AND '+NOT),
             ('en-dickens','dickens AND mediatype:texts AND language:(eng OR English) AND format:DjVuTXT AND '+FREE+' AND '+NOT)]
          ids=[]
          for n,q in Q:
              for api in ('adv','scrape'):
                  if api=='adv': u='https://archive.org/advancedsearch.php?'+urllib.parse.urlencode({'q':q,'fl[]':['identifier','title','creator','date','year','language','licenseurl','downloads','imagecount'],'rows':10,'output':'json','sort[]':'downloads desc'},doseq=True)
                  else: u='https://archive.org/services/search/v1/scrape?'+urllib.parse.urlencode({'q':q,'fields':'identifier,title,creator,date,year,language,licenseurl,downloads,imagecount','count':100,'sorts':'downloads desc'})
                  try:
                      x,b=get(u); d=json.loads(b)
                      print('\n==',n,api,x.status,'ACAO=',x.headers.get('Access-Control-Allow-Origin'))
                      docs=d['response']['docs'] if api=='adv' else d.get('items',[])
                      print('  total',d['response']['numFound'] if api=='adv' else d.get('total'),'keys',list(d.keys()))
                      for r in docs[:10]: print('   ',json.dumps(r,ensure_ascii=False)[:300])
                      if api=='adv' and n in('ru-tolstoy','ru-pushkin'): ids+= [r['identifier'] for r in docs[:2]]
                  except Exception as e: print('\n==',n,api,'ERR',e)
          for i in ids[:3]:
              try:
                  x,b=get('https://archive.org/metadata/'+i); m=json.loads(b); md=m.get('metadata',{})
                  print('\n## meta',i,json.dumps({k:md.get(k) for k in ['title','creator','date','year','language','licenseurl','possible-copyright-status','access-restricted-item','collection','description']},ensure_ascii=False)[:700])
                  fs=[f for f in m.get('files',[]) if f.get('format')=='DjVuTXT']
                  for f in fs[:6]: print('   txt',f.get('name'),f.get('size'))
                  if fs:
                      x,b=get('https://archive.org/download/'+i+'/'+urllib.parse.quote(fs[0]['name']))
                      t=b.decode('utf-8','replace'); print('  sample ACAO',x.headers.get('Access-Control-Allow-Origin'),'len',len(t)); mid=len(t)//2
                      print('-----\n'+t[mid:mid+1500]+'\n-----')
              except Exception as e: print('meta err',i,e)
          PY
          python3 p.py
