# Temporary (thread hd9bis, 13.11): «Страница сайта» on real sites — which open directly (CORS), what Jina Reader returns. Removed after.
name: web-probe
on:
  push:
    branches: [claude/project-thread-hd9bis]
    paths: [.github/workflows/web-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/project-thread-hd9bis }
      - run: cd source && RQ_NS=rqt RQ_BUILD=20261113-probe bash build-dist.sh >/dev/null
      - run: mkdir -p /tmp/srv/readquest && ln -s $PWD/source/dist/test /tmp/srv/readquest/test && (cd /tmp/srv && nohup python3 -m http.server 8790 >/dev/null 2>&1 &) && sleep 2
      - run: mkdir -p /tmp/nm && cd /tmp/nm && npm i -s puppeteer-core >/dev/null 2>&1
      - run: |
          cat > /tmp/nm/probe.mjs <<'JS'
          import puppeteer from 'puppeteer-core'; import fs from 'fs';
          const URLS = ['https://ru.wikipedia.org/wiki/Чехов,_Антон_Павлович','https://en.wikipedia.org/wiki/Reading','https://ru.wikisource.org/wiki/Каштанка_(Чехов)',
            'https://paulgraham.com/read.html','https://www.gutenberg.org/files/1342/1342-h/1342-h.htm','https://habr.com/ru/articles/717906/','https://lenta.ru/','https://ilibrary.ru/text/1199/p.1/index.html',
            'https://lib.ru/LITRA/CHEHOW/kashtanka.txt','https://developer.mozilla.org/ru/docs/Web/HTTP/CORS','https://www.bbc.com/news','https://example.com/'];
          const b = await puppeteer.launch({ executablePath: '/usr/bin/google-chrome', headless: 'new', args: ['--no-sandbox'] });
          const out = [];
          for (const u of URLS) for (const jina of [false, true]) {
            const ctx = await b.createBrowserContext(); const p = await ctx.newPage();
            await p.goto('http://127.0.0.1:8790/readquest/test/', { waitUntil: 'load' }); await p.waitForFunction(() => window.__rqReady, { timeout: 30000 }); await new Promise(r => setTimeout(r, 500));
            const t0 = Date.now();
            await p.evaluate((u, j) => { webSheet(); webGo(u, j); }, u, jina);
            try { await p.waitForFunction(() => !WEB.busy, { timeout: 60000 }); } catch (e) {}
            await new Promise(r => setTimeout(r, 1000));
            const r = await p.evaluate(async () => { const bk = S.userBooks.find(x => x.genre === 'Сайт' || x.srcId); const msg = (el('webMsg') || {}).textContent || '';
              if (!bk) return { msg, n: S.userBooks.length };
              const t = await __rq.getBookText(bk.id); return { title: bk.title, author: bk.author, genre: bk.genre, len: t.length, toc: (bk.toc || []).slice(0, 12).map(x => x.t), head: t.slice(0, 700), tail: t.slice(-400) }; });
            out.push(Object.assign({ url: u, jina, ms: Date.now() - t0 }, r)); console.log(JSON.stringify(out[out.length - 1]).slice(0, 400));
            await ctx.close();
          }
          fs.writeFileSync(process.env.GITHUB_WORKSPACE + '/web-probe.json', JSON.stringify(out, null, 1)); await b.close();
          JS
          cd /tmp/nm && node probe.mjs
      - run: |
          for u in https://ru.wikipedia.org/wiki/Reading https://paulgraham.com/read.html; do echo "== $u"; curl -s -D - -o /tmp/j.txt -H 'Origin: http://127.0.0.1:8790' "https://r.jina.ai/$u" | grep -i 'HTTP/\|access-control\|x-ratelimit'; head -c 600 /tmp/j.txt; echo; done > jina-raw.txt 2>&1 || true
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add web-probe.json jina-raw.txt && git commit -m "web-probe: результаты (временно)" && git push
