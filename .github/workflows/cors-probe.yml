# Temporary: checks which free-book sources send CORS headers (thread «Приключения»). Removed before merge.
name: cors-probe
on:
  push:
    branches: [claude/project-thread-up771x]
    paths: [.github/workflows/cors-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          O="https://hachirovmagomed-glitch.github.io"
          for u in \
            "https://gutendex.com/books/?languages=ru" \
            "https://www.gutenberg.org/ebooks/1342.txt.utf-8" \
            "https://www.gutenberg.org/cache/epub/1342/pg1342.txt" \
            "https://www.gutenberg.org/cache/epub/1342/pg1342-images.epub" \
            "https://gutenberg.pglaf.org/cache/epub/1342/pg1342.txt" \
            "https://aleph.gutenberg.org/cache/epub/1342/pg1342.txt" \
            "https://gutenberg.readingroo.ms/cache/epub/1342/pg1342.txt" \
            "https://mirrors.xmission.com/gutenberg/cache/epub/1342/pg1342.txt" \
            "https://www.gutenberg.org/ebooks/search.opds/?query=tolstoy" \
            "https://ru.wikisource.org/w/api.php?action=query&format=json&origin=*&list=search&srsearch=%D0%93%D0%B0%D0%BC%D0%BB%D0%B5%D1%82&srnamespace=0" \
            "https://ws-export.wmcloud.org/?format=txt&lang=ru&page=%D0%93%D0%B0%D0%BC%D0%BB%D0%B5%D1%82_(%D0%A8%D0%B5%D0%BA%D1%81%D0%BF%D0%B8%D1%80;_%D0%9A._%D0%A0.)" \
            "https://standardebooks.org/feeds/opds/new-releases" \
            "https://standardebooks.org/ebooks/jane-austen/pride-and-prejudice/downloads/jane-austen_pride-and-prejudice.epub" \
            "https://archive.org/advancedsearch.php?q=collection:gutenberg&fl[]=identifier&rows=1&output=json" \
            "https://archive.org/download/prideandprejudic01342gut/1342.txt" \
            "https://openlibrary.org/search.json?q=tolstoy&limit=1" \
            "https://librivox.org/api/feed/audiobooks?limit=1&format=json" \
            "https://catalog.feedbooks.com/publicdomain/browse/top.atom" ; do
            echo "=== $u"
            curl -sS -L -m 30 -o /dev/null -D - -H "Origin: $O" "$u" | grep -iE "^(HTTP/|access-control-allow-origin|location|content-type)" || echo "(failed)"
          done
          echo "=== wikisource parse sample"
          curl -sS -m 30 "https://ru.wikisource.org/w/api.php?action=parse&format=json&formatversion=2&origin=*&redirects=1&prop=text|displaytitle|categories&page=%D0%93%D0%B0%D0%BC%D0%BB%D0%B5%D1%82_(%D0%A8%D0%B5%D0%BA%D1%81%D0%BF%D0%B8%D1%80;_%D0%9A._%D0%A0.)" | head -c 6000; echo
          echo "=== wikisource search Гамлет"
          curl -sS -m 30 "https://ru.wikisource.org/w/api.php?action=query&format=json&formatversion=2&origin=*&list=search&srsearch=%D0%93%D0%B0%D0%BC%D0%BB%D0%B5%D1%82&srnamespace=0&srlimit=20" | head -c 4000; echo
          echo "=== gutendex ru count"
          curl -sS -m 30 "https://gutendex.com/books/?languages=ru" | head -c 1500; echo
