# Temporary (thread hd9bis, 13.11, run 12: улучшения раскладчика, ошибки страницы, ответ Jina): «Страница сайта» on real sites — which open directly (CORS), what Jina Reader returns. Removed after.
name: web-probe
on:
  push:
    branches: [claude/project-thread-hd9bis]
    paths: [.github/workflows/web-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/project-thread-hd9bis }
      - run: cd source && RQ_NS=rqt RQ_BUILD=20261113-probe bash build-dist.sh >/dev/null
      - run: mkdir -p /tmp/srv/readquest && ln -s $PWD/source/dist/test /tmp/srv/readquest/test && (cd /tmp/srv && nohup python3 -m http.server 8790 >/dev/null 2>&1 &) && sleep 2
      - run: mkdir -p /tmp/nm && cd /tmp/nm && npm i -s puppeteer-core >/dev/null 2>&1
      - run: |
          cat > /tmp/nm/probe.mjs <<'JS'
          import puppeteer from 'puppeteer-core'; import fs from 'fs';
          const URLS = ['https://en.wikipedia.org/wiki/Euler%27s_identity','https://ilibrary.ru/text/1199/p.1/index.html'];
          const b = await puppeteer.launch({ executablePath: '/usr/bin/google-chrome', headless: 'new', args: ['--no-sandbox'] });
          const out = [];
          for (const u of URLS) for (const jina of [/wiki|gutenberg/.test(u) ? false : true]) {
            const ctx = await b.createBrowserContext(); const p = await ctx.newPage(); const errs = []; p.on('pageerror', e => errs.push('ERR ' + e.message + ' ' + (e.stack || '').slice(0, 300))); p.on('console', m => { if (/warn|error/.test(m.type())) errs.push(m.type() + ' ' + m.text().slice(0, 300)); });
            await p.goto('http://127.0.0.1:8790/readquest/test/', { waitUntil: 'load' }); await p.waitForFunction(() => window.__rqReady, { timeout: 30000 }); await new Promise(r => setTimeout(r, 500));
            const t0 = Date.now();
            await p.evaluate((u, j) => { webSheet(); el('webIn').value = u; webGo(u, j); }, u, jina);
            try { await p.waitForFunction(() => !WEB.busy, { timeout: 120000 }); } catch (e) {}
            await new Promise(r => setTimeout(r, 500)); await p.evaluate(() => { const b = el('webAdd'); b && b.click(); }); try { await p.waitForFunction(() => !WEB.busy && S.userBooks.some(x => x.genre === 'Сайт'), { timeout: 30000 }); } catch (e) {} await new Promise(r => setTimeout(r, 800));
            const r = await p.evaluate(async () => { const bk = S.userBooks.find(x => x.genre === 'Сайт' || x.srcId); const msg = (el('webMsg') || {}).textContent || '';
              if (!bk) return { msg, n: S.userBooks.length };
              const t = bk.text || ''; let im = 0; for (let n = 0; n < 24; n++) if (await idbGet('img:' + bk.id + ':' + n)) im++; const x = await idbGet('webx:' + bk.id); const kinds = {}; (x && x.f || []).forEach(f => { kinds[f[2]] = (kinds[f[2]] || 0) + 1; }); return { title: bk.title, author: bk.author, genre: bk.genre, len: t.length, webx: x ? { len: x.len, kinds, links: x.l.length, notes: x.n.length, note0: x.n[0], pages: x.pages } : null, tr: (t.match(/\u2064\u2062/g) || []).length, fm: (t.match(/\u2064\u2061[^\n]*/g) || []).slice(0, 6), tex: (t.match(/\\displaystyle|\\frac|\{\\/g) || []).length, fmIn: (t.match(/[^\n]{0,40}[²√π∑∫][^\n]{0,40}/g) || []).slice(0, 6), trs: (t.match(/\u2064\u2062[^\n]*/g) || []).slice(0, 5), toc: (bk.toc || []).slice(0, 12).map(x => x.t), imgMarks: (t.match(/\ufffcimg:/g) || []).length, imgSaved: im, head: t.slice(0, 1200), tail: t.slice(-500) }; });
            r.errs = errs.slice(0, 8); out.push(Object.assign({ url: u, jina, ms: Date.now() - t0 }, r)); console.log(JSON.stringify(out[out.length - 1]).slice(0, 400));
            await ctx.close();
          }
          fs.writeFileSync(process.env.GITHUB_WORKSPACE + '/web-probe.json', JSON.stringify(out, null, 1)); await b.close();
          JS
          cd /tmp/nm && node probe.mjs
      - run: |
          curl -s -m 40 https://r.jina.ai/https://ilibrary.ru/text/1199/p.1/index.html | grep -n 'p\.2\|Дальше\|>>' | head -10 > ilib-next.txt; curl -s -m 30 https://ilibrary.ru/text/1199/p.1/index.html | iconv -f cp1251 -t utf-8 2>/dev/null | grep -io '.\{0,200\}p\.2.\{0,200\}' | head -3 >> ilib-next.txt; curl -sI -m 30 https://ilibrary.ru/text/1199/p.1/index.html | grep -i 'access-control\|content-type' >> ilib-next.txt; cat ilib-next.txt
          curl -s -m 30 'https://ru.wikipedia.org/w/api.php?action=parse&format=json&formatversion=2&prop=text&page=%D0%A2%D0%B5%D0%BE%D1%80%D0%B5%D0%BC%D0%B0_%D0%9F%D0%B8%D1%84%D0%B0%D0%B3%D0%BE%D1%80%D0%B0' | grep -o 'mwe-math-element.\{0,700\}' | head -2 >> ilib-next.txt
      - run: |
          for u in https://paulgraham.com/greatwork.html https://habr.com/ru/articles/717906/; do echo "== $u"; curl -s -m 30 -D - "https://r.jina.ai/$u" | head -c 1200; echo; done > jina-raw.txt 2>&1; cat jina-raw.txt
      - run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add web-probe.json jina-raw.txt ilib-next.txt && git commit -m "web-probe: результаты (временно)" && git push
