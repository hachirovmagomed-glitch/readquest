# Temporary (thread up771x, 07.11): fetch more public-domain author portraits and check collection titles from Wikimedia Commons into source/hero/authors. Removed after.
name: ws-probe
on:
  push:
    branches: [claude/project-thread-up771x]
    paths: [.github/workflows/ws-probe.yml]
permissions:
  contents: write
jobs:
  sets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/project-thread-up771x }
      - run: |
          cat > /tmp/s.py <<'PY'
          import json,urllib.request,urllib.parse,time,re
          UA={'User-Agent':'readquest-probe/1.0 (github actions)'}
          WS='https://ru.wikisource.org/w/api.php?'
          def js(p):
              for i in range(5):
                  try: return json.loads(urllib.request.urlopen(urllib.request.Request(WS+urllib.parse.urlencode(dict(p,format='json',formatversion=2)),headers=UA),timeout=60).read())
                  except Exception as e: print('retry',e); time.sleep(10*(i+1))
              return {}
          bad=re.compile(r'(?i)нарушени|копивио|copyvio|к удалению|удаляем|несвобод|не свобод|авторск')
          F=json.load(open('probe/final.json'));out={}
          for st,L in F.items():
              res=[]
              for i in range(0,len(L),50):
                  d=js({'action':'query','titles':'|'.join(L[i:i+50]),'redirects':1,'prop':'categories|info|pageprops','cllimit':'max','ppprop':'disambiguation'})
                  q=d.get('query',{});rd={}
                  for r in q.get('normalized',[])+q.get('redirects',[]): rd[r['from']]=r['to']
                  pg={p['title']:p for p in q.get('pages',[])}
                  for t in L[i:i+50]:
                      tt=t
                      for _ in range(3): tt=rd.get(tt,tt)
                      p=pg.get(tt,{'missing':True})
                      cats=[c['title'].replace('Категория:','') for c in p.get('categories',[])]
                      res.append({'t':t,'to':tt,'missing':bool(p.get('missing')),'bad':bool(bad.search(' '.join(cats))),'dis':'disambiguation' in p.get('pageprops',{}),'len':p.get('length',0),'list':any(c.startswith('Списки ') for c in cats)})
                  time.sleep(1)
              out[st]=res
          json.dump(out,open('probe/final-out.json','w'),ensure_ascii=False,indent=0)
          PY
          python3 /tmp/s.py
          git config user.name "github-actions[bot]"; git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add probe/final-out.json && git commit -qm "probe: проверка подборок" && for i in 1 2 3 4 5; do git pull -q --rebase origin claude/project-thread-up771x && git push -q origin HEAD:claude/project-thread-up771x && break; sleep 15; done
