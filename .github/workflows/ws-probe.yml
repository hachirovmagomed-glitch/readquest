# Temporary (thread up771x, 14.11): collect more Wikisource books for the collections (authors' pages and categories). Removed after.
name: ws-probe
on:
  push:
    branches: [claude/project-thread-up771x]
    paths: [.github/workflows/ws-probe.yml]
permissions:
  contents: write
jobs:
  books:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        set: [tales, antiq, myths, detect, scifi]
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/project-thread-up771x }
      - run: |
          cat > /tmp/b.py <<'PY'
          import json,urllib.request,urllib.parse,time,re,sys
          UA={'User-Agent':'readquest-probe/1.0 (github actions)'}
          WS='https://ru.wikisource.org/w/api.php?'
          def js(p):
              for i in range(5):
                  try: return json.loads(urllib.request.urlopen(urllib.request.Request(WS+urllib.parse.urlencode(dict(p,format='json',formatversion=2)),headers=UA),timeout=60).read())
                  except Exception as e: print('retry',e); time.sleep(10*(i+1))
              return None
          st=sys.argv[1];H=json.load(open('probe/harvest.json'))[st];items=[];seenall=set()
          for n in H['authors']:
              d=js({'action':'query','list':'search','srnamespace':102,'srlimit':5,'srsearch':n}) or {}
              hs=[h['title'] for h in d.get('query',{}).get('search',[])]
              key=[w for w in re.split(r'\s+',n) if len(w)>1][0].lower()
              hs=[h for h in hs if key in h.lower()]
              if not hs: print('noauthor',n);continue
              p=js({'action':'parse','page':hs[0],'prop':'text'}) or {}
              html=p.get('parse',{}).get('text','');html=re.sub(r'(?s)<(table|div)[^>]*class="[^"]*navbox.*?</\1>','',html)
              c=0
              for m in re.finditer(r'<a ([^>]*)>',html):
                  a=m.group(1)
                  if 'class="new"' in a: continue
                  tt=re.search(r'title="([^"]*)"',a)
                  if not tt: continue
                  tt=tt.group(1).replace('&quot;','"').replace('&amp;','&').replace('&#39;',"'");root=tt.split('/')[0]
                  if re.match(r'^[^:]+:\S',tt) or '(' not in root or re.search(r'ДО\)|\(ДО|старой орфографии',tt) or root in seenall: continue
                  seenall.add(root);items.append([hs[0],root]);c+=1
                  if c>=300: break
              print(n,hs[0],c,flush=True);time.sleep(0.5)
          for cat in H['cats']:
              todo=['Категория:'+cat];done=set();c=0
              while todo and c<1500:
                  ct=todo.pop(0)
                  if ct in done: continue
                  done.add(ct);cont={}
                  while True:
                      d=js(dict({'action':'query','list':'categorymembers','cmtitle':ct,'cmlimit':500,'cmnamespace':'0|14'},**cont)) or {}
                      for m in d.get('query',{}).get('categorymembers',[]):
                          if m['ns']==14:
                              if len(done)<40: todo.append(m['title'])
                              continue
                          root=m['title'].split('/')[0]
                          if root in seenall or '(' not in root: continue
                          seenall.add(root);items.append(['cat:'+cat,root]);c+=1
                      if 'continue' in d and c<1500: cont=d['continue']
                      else: break
                  time.sleep(0.3)
              print('cat',cat,c,flush=True)
          print(st,len(items),flush=True)
          info={};titles=[x[1] for x in items]
          for i in range(0,len(titles),10):
              B=titles[i:i+10]
              d=js({'action':'query','titles':'|'.join(B),'redirects':1,'prop':'categories|info|pageprops','cllimit':'max','ppprop':'disambiguation'})
              if d is None: continue
              q=d.get('query',{});rd={}
              for r in q.get('normalized',[])+q.get('redirects',[]): rd[r['from']]=r['to']
              pg={p['title']:p for p in q.get('pages',[])}
              for t in B:
                  tt=t
                  for _ in range(3): tt=rd.get(tt,tt)
                  p=pg.get(tt)
                  if not p or p.get('missing'): info[t]={'miss':1};continue
                  info[t]={'to':tt,'len':p.get('length',0),'dis':'disambiguation' in p.get('pageprops',{}),'cats':[c['title'].replace('Категория:','') for c in p.get('categories',[])][:30]}
              time.sleep(0.3)
          json.dump([{'a':n,'t':t,**info.get(t,{'miss':1,'err':1})} for n,t in items],open('probe/b3-'+st+'.json','w'),ensure_ascii=False)
          PY
          python3 /tmp/b.py ${{ matrix.set }}
          git config user.name "github-actions[bot]"; git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add probe/b3-${{ matrix.set }}.json && git commit -qm "probe: книги ${{ matrix.set }}" && for i in 1 2 3 4 5 6 7 8; do git pull -q --rebase origin claude/project-thread-up771x && git push -q origin HEAD:claude/project-thread-up771x && break; sleep $((RANDOM%20+5)); done
