# Temporary (thread hd9bis, 13.11, run 3): «Страница сайта» on real sites — which open directly (CORS), what Jina Reader returns. Removed after.
name: web-probe
on:
  push:
    branches: [claude/project-thread-hd9bis]
    paths: [.github/workflows/web-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/project-thread-hd9bis }
      - run: cd source && RQ_NS=rqt RQ_BUILD=20261113-probe bash build-dist.sh >/dev/null
      - run: mkdir -p /tmp/srv/readquest && ln -s $PWD/source/dist/test /tmp/srv/readquest/test && (cd /tmp/srv && nohup python3 -m http.server 8790 >/dev/null 2>&1 &) && sleep 2
      - run: mkdir -p /tmp/nm && cd /tmp/nm && npm i -s puppeteer-core >/dev/null 2>&1
      - run: |
          cat > /tmp/nm/probe.mjs <<'JS'
          import puppeteer from 'puppeteer-core'; import fs from 'fs';
          const URLS = ['https://ru.wikipedia.org/wiki/Чехов,_Антон_Павлович','https://ru.wikisource.org/wiki/Каштанка_(Чехов)','https://paulgraham.com/read.html','https://habr.com/ru/articles/717906/','https://ilibrary.ru/text/1199/p.1/index.html','https://developer.mozilla.org/ru/docs/Web/HTTP/CORS','https://www.bbc.com/russian/articles/c4g9kwzxl5lo','https://lenta.ru/articles/2024/01/15/books/','https://arzamas.academy/mag/1211-reading','https://vc.ru/books/1000000','https://nplus1.ru/material/2024/05/20/reading-brain','https://meduza.io/feature/2024/01/10/chto-chitat'];
          const b = await puppeteer.launch({ executablePath: '/usr/bin/google-chrome', headless: 'new', args: ['--no-sandbox'] });
          const out = [];
          for (const u of URLS) for (const jina of [/wiki/.test(u) ? false : true]) {
            const ctx = await b.createBrowserContext(); const p = await ctx.newPage();
            await p.goto('http://127.0.0.1:8790/readquest/test/', { waitUntil: 'load' }); await p.waitForFunction(() => window.__rqReady, { timeout: 30000 }); await new Promise(r => setTimeout(r, 500));
            const t0 = Date.now();
            await p.evaluate((u, j) => { webSheet(); webGo(u, j); }, u, jina);
            try { await p.waitForFunction(() => !WEB.busy, { timeout: 60000 }); } catch (e) {}
            await new Promise(r => setTimeout(r, 500)); await p.evaluate(() => { const b = el('webAdd'); b && b.click(); }); try { await p.waitForFunction(() => !WEB.busy && S.userBooks.some(x => x.genre === 'Сайт'), { timeout: 30000 }); } catch (e) {} await new Promise(r => setTimeout(r, 800));
            const r = await p.evaluate(async () => { const bk = S.userBooks.find(x => x.genre === 'Сайт' || x.srcId); const msg = (el('webMsg') || {}).textContent || '';
              if (!bk) return { msg, n: S.userBooks.length };
              const t = bk.text || ''; let im = 0; for (let n = 0; n < 24; n++) if (await idbGet('img:' + bk.id + ':' + n)) im++; return { title: bk.title, author: bk.author, genre: bk.genre, len: t.length, toc: (bk.toc || []).slice(0, 12).map(x => x.t), imgMarks: (t.match(/\ufffcimg:/g) || []).length, imgSaved: im, head: t.slice(0, 1500), tail: t.slice(-700) }; });
            out.push(Object.assign({ url: u, jina, ms: Date.now() - t0 }, r)); console.log(JSON.stringify(out[out.length - 1]).slice(0, 400));
            await ctx.close();
          }
          fs.writeFileSync(process.env.GITHUB_WORKSPACE + '/web-probe.json', JSON.stringify(out, null, 1)); await b.close();
          JS
          cd /tmp/nm && node probe.mjs
      - run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add web-probe.json && git commit -m "web-probe: результаты (временно)" && git push
