# Temporary probe for «Приключения» (thread up771x): exact Wikisource titles for new collections. Removed after.
name: ws-probe
on:
  push:
    branches: [claude/project-thread-up771x]
    paths: [.github/workflows/ws-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          cat > p.py <<'PY'
          import json,urllib.request,urllib.parse,time
          UA={'User-Agent':'readquest-probe/1.0 (github actions)'}
          T='''Калевала (Бельский)|Старшая Эдда|Песнь о Нибелунгах (Кудряшов)|Песнь о Роланде (Кузмин)|Песнь о Роланде|Слово о полку Игореве (Жуковский)|Гильгамеш (Гумилёв)|Тристан и Изольда (Бедье; Веселовский)|Наль и Дамаянти (Жуковский)|Рустем и Зораб (Жуковский)|Песнь о Гайавате (Лонгфелло; Бунин)|Садко (былина)|Вольга и Микула|Илья Муромец и Соловей-разбойник|Беовульф|Сид|Песнь о моём Сиде|Мифы Древней Греции|Собака Баскервилей (Дойль)|Собака Баскервилей|Убийство на улице Морг (По; Бальмонт)|Убийство в улице Морг (По)|Золотой жук (По)|Золотой жук (По; Бальмонт)|Похищенное письмо (По)|Лунный камень (Коллинз)|Пёстрая лента (Дойль; 1896)|Шведская спичка (Чехов)|Драма на охоте (Чехов)|Тайна отца Брауна (сборник — Честертон)|Этюд в багровых тонах (Дойль)|Знак четырёх (Дойль)|Голубой карбункул (Дойль)|Гиперболоид инженера Гарина (Толстой)|Аэлита (Толстой)|Борьба в эфире (Беляев)|Властелин мира (Беляев, 1963)|Остров погибших кораблей (Беляев)|Голова профессора Доуэля (Беляев)|Человек-амфибия (Беляев)|Жидкое солнце (Куприн)|Городок в табакерке (Одоевский)|4338-й год (Одоевский)|Красная звезда (Богданов)|Республика Южного Креста (Брюсов)|На Луне (Циолковский)|Вне Земли (Циолковский)|Грёзы о земле и небе (Циолковский)'''.split('|')
          for k in range(0,len(T),45):
              u='https://ru.wikisource.org/w/api.php?'+urllib.parse.urlencode({'action':'query','format':'json','formatversion':2,'redirects':1,'prop':'categories|info|pageprops','cllimit':'max','titles':'|'.join(T[k:k+45])})
              d=json.loads(urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=90).read())
              q=d.get('query',{})
              for r in q.get('redirects',[]):print('REDIR',r['from'],'->',r['to'])
              for p in q.get('pages',[]):
                  cats=[c['title'].replace('Категория:','') for c in p.get('categories',[])]
                  print('MISSING' if p.get('missing') else 'OK', p['title'], p.get('length'), [c for c in cats if c.startswith('PD') or 'Списки' in c or 'Неоднознач' in c or 'авторск' in c.lower() or 'Не PD' in c][:4], 'DISAMB' if 'disambiguation' in p.get('pageprops',{}) else '')
          PY
          python3 p.py
