# Temporary probe for «Приключения» (thread up771x): Internet Archive title search and OCR text sample. Removed after.
name: ws-probe
on:
  push:
    branches: [claude/project-thread-up771x]
    paths: [.github/workflows/ws-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          cat > p.py <<'PY'
          import json,urllib.request,urllib.parse
          UA={'User-Agent':'readquest-probe/1.0 (github actions)','Origin':'https://example.org'}
          def get(u):
              x=urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=60); return x,x.read()
          FREE='(date:[1000-01-01 TO 1929-12-31] OR year:[1000 TO 1929] OR (licenseurl:*publicdomain* AND NOT date:[1930-01-01 TO 2100-12-31] AND NOT year:[1930 TO 2100]))'
          NOT='NOT collection:(inlibrary OR printdisabled OR lendinglibrary OR internetarchivebooks) NOT access-restricted-item:true'
          PER='NOT collection:(newspapers OR magazine_rack OR magazine_packs OR periodicals OR serials) NOT title:(ведомости OR газета OR журнал OR вестник OR известия OR gazette OR newspaper)'
          BASE='mediatype:texts AND format:DjVuTXT AND '+FREE+' AND '+NOT
          def T(q): return '(title:('+q+') OR creator:('+q+'))'
          Q=[('ru-empty-creator','collection:booksbylanguage AND creator:* AND '+PER+' AND language:(rus OR Russian) AND '+BASE),
             ('ru-empty-subject','collection:booksbylanguage AND subject:* AND creator:* AND '+PER+' AND language:(rus OR Russian) AND '+BASE),
             ('en-empty-creator','collection:booksbylanguage AND creator:* AND '+PER+' AND language:(eng OR English) AND '+BASE),
             ('ru-tolstoy',T('(толстой)')+' AND language:(rus OR Russian) AND '+BASE)]
          ids=[]
          for n,q in Q:
              u='https://archive.org/advancedsearch.php?'+urllib.parse.urlencode({'q':q,'fl[]':['identifier','title','creator','date','year','language','licenseurl','downloads','imagecount'],'rows':12,'page':1,'output':'json','sort[]':'downloads desc'},doseq=True)
              try:
                  x,b=get(u); d=json.loads(b)
                  print('\n==',n,x.status,'ACAO=',x.headers.get('Access-Control-Allow-Origin'),'total',d['response']['numFound'])
                  for r in d['response']['docs']: print('   ',json.dumps({k:r.get(k) for k in ('identifier','title','creator','year','language','imagecount')},ensure_ascii=False)[:260])
                  pass
              except Exception as e: print('\n==',n,'ERR',e)
          for i in ids[:3]:
              try:
                  x,b=get('https://archive.org/metadata/'+i); m=json.loads(b); md=m.get('metadata',{})
                  print('\n## meta',i,json.dumps({k:md.get(k) for k in ['title','creator','date','year','language','licenseurl','possible-copyright-status','access-restricted-item','collection','description']},ensure_ascii=False)[:700])
                  fs=[f for f in m.get('files',[]) if f.get('format')=='DjVuTXT']
                  for f in fs[:6]: print('   txt',f.get('name'),f.get('size'))
                  if fs:
                      x,b=get('https://archive.org/download/'+i+'/'+urllib.parse.quote(fs[0]['name']))
                      t=b.decode('utf-8','replace'); print('  sample ACAO',x.headers.get('Access-Control-Allow-Origin'),'len',len(t)); mid=len(t)//2
                      q=len(t)//3; print('-----\n'+t[q:q+900]+'\n-----'); print('FF',t.count('\f'),'NOT',t.count('\u00ac'),'blank',t.count('\n\n'))
              except Exception as e: print('meta err',i,e)
          PY
          python3 p.py
