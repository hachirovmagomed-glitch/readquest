# Temporary (thread up771x, 07.11): fetch more public-domain author portraits and check collection titles from Wikimedia Commons into source/hero/authors. Removed after.
name: ws-probe
on:
  push:
    branches: [claude/project-thread-up771x]
    paths: [.github/workflows/ws-probe.yml]
permissions:
  contents: write
jobs:
  sets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/project-thread-up771x }
      - run: |
          cat > /tmp/s.py <<'PY'
          import json,urllib.request,urllib.parse,time,re
          UA={'User-Agent':'readquest-probe/1.0 (github actions)'}
          WS='https://ru.wikisource.org/w/api.php?'
          def js(p):
              for i in range(5):
                  try: return json.loads(urllib.request.urlopen(urllib.request.Request(WS+urllib.parse.urlencode(dict(p,format='json',formatversion=2)),headers=UA),timeout=60).read())
                  except Exception as e: print('retry',e); time.sleep(10*(i+1))
              return {}
          res={'miss':[],'authors':{},'cats':{}}
          for st,t,s in json.load(open('probe/miss.json')):
              roots=[]
              for q in ['intitle:"'+t+'"', t+(' '+s if s else '')]:
                  d=js({'action':'query','list':'search','srnamespace':0,'srlimit':15,'srsearch':q})
                  for h in d.get('query',{}).get('search',[]):
                      r=h['title'].split('/')[0]
                      if r not in roots: roots.append(r)
                  time.sleep(0.4)
              res['miss'].append([st,t,s,roots[:15]])
          H=json.load(open('probe/harvest.json'))
          for st,names in H['authors'].items():
              for n in names:
                  d=js({'action':'query','list':'search','srnamespace':102,'srlimit':3,'srsearch':n})
                  hs=[h['title'] for h in d.get('query',{}).get('search',[])]
                  if not hs: res['authors'][n]=None;continue
                  p=js({'action':'parse','page':hs[0],'prop':'text'})
                  html=p.get('parse',{}).get('text','');html=re.sub(r'(?s)<(table|div)[^>]*class="[^"]*navbox.*?</\1>','',html)
                  seen=[];
                  for m in re.finditer(r'<a ([^>]*)>',html):
                      a=m.group(1)
                      if 'class="new"' in a: continue
                      tt=re.search(r'title="([^"]*)"',a)
                      if not tt: continue
                      tt=tt.group(1).replace('&quot;','"').replace('&amp;','&');root=tt.split('/')[0]
                      if re.match(r'^[^:]+:\S',tt) or '(' not in root or re.search(r'ДО\)|\(ДО|старой орфографии',tt) or root in seen: continue
                      seen.append(root)
                  res['authors'][n]={'page':hs[0],'set':st,'items':seen[:400]};time.sleep(1)
          for st,cs in H['cats'].items():
              for c in cs:
                  d=js({'action':'query','list':'categorymembers','cmtitle':'Категория:'+c,'cmlimit':500,'cmnamespace':0})
                  res['cats'][c]={'set':st,'items':[x['title'] for x in d.get('query',{}).get('categorymembers',[])]};time.sleep(1)
          json.dump(res,open('probe/harvest-out.json','w'),ensure_ascii=False,indent=0)
          PY
          python3 /tmp/s.py
          git config user.name "github-actions[bot]"; git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add probe/harvest-out.json && git commit -qm "probe: ещё книги для подборок" && for i in 1 2 3 4 5; do git pull -q --rebase origin claude/project-thread-up771x && git push -q origin HEAD:claude/project-thread-up771x && break; sleep 15; done
