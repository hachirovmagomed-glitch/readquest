# Temporary probe for «Приключения» (thread up771x): Standard Ebooks page markup. Removed after.
name: ws-probe
on:
  push:
    branches: [claude/project-thread-up771x]
    paths: [.github/workflows/ws-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          cat > p.py <<'PY'
          import re,urllib.request
          UA={'User-Agent':'readquest-probe/1.0 (github actions)'}
          def get(u):
              x=urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=30); return x.read().decode('utf-8','replace')
          h=get('https://standardebooks.org/ebooks?query=dickens&view=list&per-page=12')
          i=h.find('<main'); print('MAIN at',i,'len',len(h)); print(h[i:i+9000])
          print('\n\n==== tail around pagination'); j=h.find('nav class="pagination'); print(h[j-200:j+1500] if j>0 else 'no pagination')
          h=get('https://standardebooks.org/ebooks?query=zzzzqqq'); i=h.find('<main'); print('\n\n==== EMPTY'); print(h[i:i+2500])
          h=get('https://standardebooks.org/ebooks/jane-austen/pride-and-prejudice')
          i=h.find('<main'); print('\n\n==== BOOK len',len(h)); print(h[i:i+7000])
          for k in ['epub','word count','reading-time','Reading','words','meta property']:
              for m in list(re.finditer(re.escape(k),h))[:6]: print('  ',k,'->',h[max(0,m.start()-200):m.start()+250].replace('\n',' '))
          PY
          python3 p.py
