<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>@font-face{font-family:"Yeseva One";src:url("fonts/YesevaOne-Regular.ttf")}@font-face{font-family:"Arsenal";font-weight:400;src:url("fonts/Arsenal-Regular.ttf")}@font-face{font-family:"Arsenal";font-weight:600 900;src:url("fonts/Arsenal-Bold.ttf")}
@font-face{font-family:"Podkova";font-weight:400 800;src:url("fonts/Podkova-VariableFont_wght.ttf")}@font-face{font-family:"Bitter";font-weight:100 900;src:url("fonts/Bitter-VariableFont_wght.ttf")}
*{box-sizing:border-box;margin:0;padding:0}body{width:390px;height:844px;overflow:hidden;position:relative;font-family:"Arsenal",sans-serif;font-weight:600;color:#23180f;background:#e9d8bd}
.abs{position:absolute;pointer-events:none}.H{font-family:"Yeseva One",serif;font-weight:400}.num{font-family:"Podkova",serif;font-weight:700}
.card{position:relative;background:#fbf5e9;border-radius:6px;box-shadow:0 0 0 1px #c9b28c,0 0 0 4px #fbf5e9,0 0 0 5px #b8946a,0 6px 16px rgba(60,35,10,.18)}
.card>.tc{left:12px;top:6px}
.hdr{position:absolute;top:0;left:0;right:0;padding:52px 20px 0;display:flex;align-items:center;justify-content:space-between;z-index:2}
.hdr h1{font-family:"Yeseva One",serif;font-weight:400;font-size:29px;color:#fbf5e9;letter-spacing:0.3px;line-height:1}
.bal{display:flex;align-items:center;gap:6px;padding:3px 14px 3px 3px;font-weight:700;font-size:14px;color:#23180f;background:#fbf5e9;border-radius:20px;box-shadow:0 0 0 1.5px #d4c3a6}
.nav{position:absolute;left:14px;right:14px;bottom:14px;height:66px;display:flex;align-items:center;padding:0 8px;isolation:isolate}
.nav .t{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;font-weight:700;color:#5a4634;position:relative;padding:6px 0}
.nav .on{color:#ffffff}.nav .on:before{content:"";position:absolute;inset:2px 8px;z-index:-1;background:#2c4a8a;border-radius:6px}
.btn{display:flex;align-items:center;justify-content:center;height:52px;font-family:"Yeseva One",serif;font-weight:400;font-size:21px;color:#ffffff;background:#2c4a8a;border-radius:6px;box-shadow:0 0 0 1.5px #1f3768}
.bar{height:8px;background:#efe4d0;border-radius:4px;box-shadow:inset 0 0 0 1px #d4c3a6}.bar i{display:block;height:100%;border-radius:4px;background:#2c4a8a}
.cap{font-size:12.5px;color:#5a4634}
/* читалка: страница чистая — без декора и маскота */
.rd{position:absolute;inset:0;background:#fbf6ec;color:#23180f}
.page{position:absolute;top:96px;bottom:150px;left:0;right:0;overflow:hidden;padding:20px 26px 0;font-family:"Bitter",serif;font-size:16px;line-height:1.7}
.page h3{font-family:"Yeseva One",serif;font-weight:400;font-size:24px;margin-bottom:12px}.page p{text-indent:1.4em;margin-bottom:6px}
.rtop{position:absolute;top:0;left:0;right:0;height:96px;padding:44px 8px 0;display:flex;align-items:center;background:#efe3cf;box-shadow:0 1px 0 #d4c3a6}
.rtop .t{flex:1;text-align:center;font-family:"Yeseva One",serif;font-weight:400;font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;display:flex;align-items:center;justify-content:center;color:#2c4a8a}
.rbot{position:absolute;left:0;right:0;bottom:0;height:150px;background:#efe3cf;box-shadow:0 -1px 0 #d4c3a6;padding:16px 22px 0}
.pg{display:flex;justify-content:center;font-size:15px;margin-bottom:10px;font-weight:700}
.sl{position:relative;height:24px}.sl .tr{position:absolute;top:10px;left:0;right:0;height:4px;border-radius:2px;background:#d4c3a6}.sl .fi{position:absolute;top:10px;left:0;height:4px;border-radius:2px;background:#2c4a8a}
.sl .th{position:absolute;top:2px;margin-left:-10px;width:20px;height:20px;border-radius:50%;background:#fbf6ec;border:2px solid #2c4a8a}
.tools{display:flex;justify-content:space-around;margin-top:14px;font-size:13px;font-weight:700}.tools div{display:flex;flex-direction:column;align-items:center;gap:3px}.tools svg{color:#2c4a8a}
.night .rd{background:#15100b;color:#ebdfcc}.night .rtop,.night .rbot{background:#211910}.night .rtop{box-shadow:0 1px 0 #3a2c1e}.night .rbot{box-shadow:0 -1px 0 #3a2c1e}
.night .rtop .t,.night .pg,.night .tools{color:#f1e6d6}.night .ib,.night .tools svg{color:#f2d2a9}
.night .sl .tr{background:#3a2c1e}.night .sl .fi{background:#f2d2a9}.night .sl .th{background:#15100b;border-color:#f2d2a9}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

.stats{display:flex;margin:10px 0 14px;gap:8px}.st{flex:1;padding:8px 4px;border-radius:6px;background:#2a2017;box-shadow:inset 0 0 0 1px #45342a}
.st b{display:block;font-family:"Podkova",serif;font-weight:700;font-size:24px;line-height:1.25}.st span{font-size:13px;color:#cdb9a0}
.xpl{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:700;margin-bottom:6px}.sm .cap{color:#cdb9a0}
.sm .bar{background:#2a2017;box-shadow:inset 0 0 0 1px #45342a}.sm .bar i{background:#f2d2a9}
